name: Deploy Street Memory to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test game logic and systems
        run: npm test
      - name: Validate frozen campaign
        run: npm run validate:levels
      - name: Build independent Pages playtest
        run: npm run build
      - name: Audit dist and resource paths
        run: npm run audit:pages
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test production game in its project subpath
        run: npm run test:pages
      - name: Check seven viewport and DPR combinations with browser screenshots
        run: |
          npm run preview:pages &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4180/bgs-sm-playtest-7f42/ >/dev/null && break
            sleep 1
          done
          npm run test:visual
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload only dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
